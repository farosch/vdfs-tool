name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$latest" ]; then
            current=${latest#v}
            major=$(echo "$current" | cut -d. -f1)
            minor=$(echo "$current" | cut -d. -f2)
            patch=$(echo "$current" | cut -d. -f3)
            version="$major.$minor.$((patch + 1))"
          else
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, version]
    if: needs.version.outputs.new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          version=${VERSION#v}
          python <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"][1:]
          manifest = pathlib.Path("Cargo.toml")
          text = manifest.read_text()
          text = re.sub(
              r'(?m)^version = "[^"]+"',
              f'version = "{version}"',
              text,
              count=1,
          )
          manifest.write_text(text)

          lock = pathlib.Path("Cargo.lock")
          text = lock.read_text()
          text = re.sub(
              r'(name = "vdfs-tool"\nversion = ")[^"]+(")',
              lambda match: f'{match.group(1)}{version}{match.group(2)}',
              text,
              count=1,
          )
          lock.write_text(text)
          PY

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="vdfs-tool-${TAG}-${TARGET}"
          bin="vdfs-tool"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="vdfs-tool.exe"; fi
          mkdir "$name"
          cp "target/${TARGET}/release/${bin}" README.md LICENSE "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${name}.zip" "$name" >/dev/null
            echo "ARCHIVE=${name}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${name}.tar.gz" "$name"
            echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "vdfs-tool $TAG" \
            --generate-notes

[package]
name = "vdfs-tool"
version = "0.1.3"
edition = "2024"
description = "Samsung VDFS4 and VDFS1002 filesystem image packer and unpacker"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
zstd = "0.13"
lz4_flex = "0.14"
anyhow = "1"
sha2 = "0.10"
indicatif = "0.18"
md-5 = "0.10"
sha1 = "0.10"
aes = "0.9.4"
ctr = "0.10.1"
serde_json = "1"
lzo = "0.1.4"
rust_lzo1x = { package = "rust-lzo1x", version = "0.4.0" }
